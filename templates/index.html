<!DOCTYPE html>


<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Carbon Commute Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <h1>Carbon Commute Calculator</h1>
</header>


<main class="container">

        <section class="left-panel">
        <h2>Plan Your Trip</h2>

        <form action="/calculate" method="POST">

            <label>Origin Address</label>
            <input type="text" name="origin" placeholder="Street, City, State" required>

            <label>Destination Address</label>
            <input type="text" name="destination" placeholder="Street, City, State" required>

            <label>Passengers</label>
            <input type="number" name="passengers" value="1" min="1">



            <button type="submit">Calculate Emissions</button>
            


        </form>

            <button onclick="window.location.href='/manage-vehicles'">
            Manage Vehicles
        </button>
    
    </section>


    <!-- MAP PANEL -->
    <section class="map-panel">
        <div id="map"></div>
    </section>


    <!-- RIGHT PANEL -->
    <section class="right-panel">
        <button class="add-vehicle">
            + Add Vehicle
        </button>
    </section>

</main>





    













<div class = "flowerfield">

</div>

<footer>
    <p>&copy; 2026 Bhargavi Kale, Isabella Velazquez-Abelardo | Carbon Commute Calculator </p>
</footer>
<script>
function initMap() {
    const center = { lat: 43.1339, lng: -70.9264 }; // UNH / Durham area

    const map = new google.maps.Map(document.getElementById("map"), {
        zoom: 12,
        center: center,
    });

    new google.maps.Marker({
        position: center,
        map: map,
    });
}
</script>

<script async
src="https://maps.googleapis.com/maps/api/js?key={{ API_KEY }}&callback=initMap">
</script>
</body>
</html>
